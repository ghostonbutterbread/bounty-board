<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Bounty Board</title>
  <script>/* Apply the saved theme and sidebar state before first paint. */try{var t=localStorage.getItem('bounty-board-theme');if(t==='light'||t==='dark'||t==='dusk')document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="/vendor/font-awesome/css/font-awesome.min.css">
  <link rel="stylesheet" href="/vendor/easymde/easymde.min.css">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/vendor/easymde/easymde.min.js"></script>
  <script defer src="/api.js"></script>
  <script defer src="/app.js"></script>
  <!-- Feature modules: one line per module, loaded after app.js -->
  <link rel="stylesheet" href="/modules/live-editor.css"><script defer src="/modules/live-editor.js"></script>
  <link rel="stylesheet" href="/modules/ledger-actions.css"><script defer src="/modules/ledger-actions.js"></script>
  <link rel="stylesheet" href="/modules/finding-actions.css"><script defer src="/modules/finding-actions.js"></script>
  <link rel="stylesheet" href="/modules/report-artifacts.css"><script defer src="/modules/report-artifacts.js"></script>
  <link rel="stylesheet" href="/modules/search.css"><script defer src="/modules/search.js"></script>
  <script defer src="/modules/taxonomy.js"></script>
  <link rel="stylesheet" href="/modules/coverage-drilldown.css"><script defer src="/modules/coverage-drilldown.js"></script>
  <link rel="stylesheet" href="/modules/recent-reports.css"><script defer src="/modules/recent-reports.js"></script>
  <link rel="stylesheet" href="/modules/recon-intel.css"><script defer src="/modules/recon-intel.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app" id="shell">
    <aside class="sidebar" aria-label="Workspace navigation">
      <div class="brand"><span class="mark" aria-hidden="true">BB</span><span>Bounty Board<small>Research workspace</small></span></div>
      <p class="nav-label">Workspace</p>
      <nav class="nav"><a href="#/dashboard" data-view="dashboard" class="active" aria-current="page" title="Dashboard"><i class="fa fa-th-large" aria-hidden="true"></i><span>Dashboard</span></a><a href="#/recent" data-view="recent" title="Recent reports"><i class="fa fa-clock-o" aria-hidden="true"></i><span>Recent reports</span></a><a href="#/recon" data-view="recon" title="Recon intel"><i class="fa fa-crosshairs" aria-hidden="true"></i><span>Recon intel</span></a><a href="#/programs" data-view="program" title="Programs"><i class="fa fa-folder-open-o" aria-hidden="true"></i><span>Programs</span></a></nav>
      <p class="nav-label" id="recent-label" hidden>Recent</p>
      <div class="recent" id="recent-programs" aria-labelledby="recent-label"></div>
      <div class="side-foot">
        <div class="side-note"><strong>Evidence, in context.</strong><p>Counts reflect loaded records, not test depth or program-wide coverage.</p></div>
        <button type="button" class="side-link collapse-toggle" id="sidebar-toggle" aria-expanded="true" aria-controls="shell" title="Collapse sidebar"><i class="fa fa-angle-double-left" aria-hidden="true"></i><span>Collapse sidebar</span></button>
      </div>
    </aside>
    <div class="body">
      <header class="topbar">
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="#/dashboard" class="crumb-root">Workspace</a><span class="sep" aria-hidden="true">/</span><span id="breadcrumb">Dashboard</span><span id="breadcrumb-trail" class="crumb"></span></nav>
        <div class="top-actions">
          <div id="global-search-host"></div>
          <button type="button" id="theme-button" class="button ghost icon-only" aria-haspopup="menu" aria-expanded="false" aria-label="Theme" title="Theme"><i class="fa fa-sun-o" aria-hidden="true"></i></button>
          <button id="refresh" class="button sm"><i class="fa fa-refresh" aria-hidden="true"></i><span>Refresh</span></button>
        </div>
      </header>
      <main id="main" class="page" tabindex="-1"><div id="app" aria-live="polite"><div class="state">Loading workspace…</div></div></main>
    </div>
  </div>
  <div id="ui-layer"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
