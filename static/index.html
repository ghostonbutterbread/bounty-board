<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Bounty Board</title>
  <link rel="stylesheet" href="/vendor/font-awesome/css/font-awesome.min.css">
  <link rel="stylesheet" href="/vendor/easymde/easymde.min.css">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/vendor/easymde/easymde.min.js"></script>
  <script defer src="/api.js"></script>
  <script defer src="/app.js"></script>
  <!-- Feature modules: one line per module, loaded after app.js -->

<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app">

      <div class="brand"><span class="mark" aria-hidden="true">B</span><span>Bounty Board<small>Research workspace</small></span></div>
      <p class="nav-label">Workspace</p>
      <nav class="nav"><button data-view="dashboard" class="active" aria-current="page"><span aria-hidden="true">◫</span> Dashboard</button><button data-view="program"><span aria-hidden="true">▤</span> Programs</button></nav>

      <main id="main" class="page" tabindex="-1"><div id="app" aria-live="polite"><div class="state">Loading workspace…</div></div></main>
    </div>
  </div>
